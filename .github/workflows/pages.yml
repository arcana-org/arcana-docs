# The book, built and published to GitHub Pages.  It describes Arcana
# as it is on main: arcana-org/arcana is checked out beside it for the
# chapters to include from, and its commit is named on every page.
name: book

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so that the book follows Arcana's main.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Arcana, beside the book
        uses: actions/checkout@v5
        with:
          repository: arcana-org/arcana
          path: arcana

      - name: mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" |
              tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: The Arcana it describes
        run: |
          commit=$(git -C arcana rev-parse --short=12 HEAD)
          sed -i "s/@ARCANA_COMMIT@/${commit}/" theme/footer.js
          echo "Arcana at ${commit}" >> "$GITHUB_STEP_SUMMARY"

      - name: The chapters made from Arcana's tree
        run: |
          sudo apt-get install -y -qq mandoc > /dev/null
          tools/gen.sh

      - name: Build
        run: mdbook build

      # Chrome 157 on the runner writes no PDF of the book and says
      # nothing but dbus noise (it does where the book is built by hand):
      # the site is not held back for it; the step stays red.
      - name: The whole book as one PDF
        continue-on-error: true
        run: |
          # Chrome exits 0 whether or not it wrote the file: what it said
          # is put in the run's annotations when there is no PDF.
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu \
              --no-pdf-header-footer --virtual-time-budget=20000 \
              --print-to-pdf=book/arcana.pdf "file://$PWD/book/print.html" \
              > chrome.log 2>&1 || true
          if [ ! -s book/arcana.pdf ]; then
              echo "::warning title=chrome::$(google-chrome --version), $(wc -l < chrome.log) lines said, print.html $(wc -c < book/print.html) bytes, $(ls book/arcana.pdf 2>&1)"
              tail -6 chrome.log | while read -r l; do
                  echo "::warning title=chrome::$l"
              done
              exit 1
          fi
          ls -l book/arcana.pdf

      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          # The 404 page links to the site's root, which local files lack.
          args: --offline --no-progress --include-fragments --exclude-path book/404.html --exclude 'arcana\.pdf$' book
          fail: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
